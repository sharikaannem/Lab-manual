<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-image:url(download\ \(13\).jpg);
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
                min-height:100vh;
                margin:0;
            }
            input {
                padding: 8px;
                width: 250px;
                margin-top: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            #msg {
                font-size: 14px;
                margin-top: 10px;
                font-style: normal;
            }
            div{
                justify-content:center;
                text-align:center;
            }
            h1{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <h1><i>Password Strength Checker (Weak or Strong Detection)</i></h1>
        <div>
            password<input type="password" id="pass" onkeyup="checkstrength()"><br>
            <p id="msg"></p>
        </div>
        <script>
            function checkstrength(){
                let password=document.getElementById("pass").value;
                let msg=document.getElementById("msg");
                let strongpattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
                if(password.length===0){
                    msg.innerHTML="";
                }
                else if(strongpattern.test(password)){
                    msg.innerHTML="strong password";
                    msg.style.color="green";
                }
                else{
                    msg.innerHTML="weak password";
                    msg.style.color="red";
                }
            }
        </script>
    </body>
</html>
